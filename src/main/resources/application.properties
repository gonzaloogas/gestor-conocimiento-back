spring.application.name=gestor-conocimiento-back
server.port=8000
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_conocimiento
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jackson.hibernate.use_transient = false

logging.level.org.springframework.web = DEBUG
logging.level.org.hibernate = ERROR

application.title = GESTOR DEL CONOCIMIENTO
application.version = V.0.0.1
application.location = GETRONICS CHILE

# Keycloak Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/g-manager-realm-dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/g-manager-realm-dev/protocol/openid-connect/certs

jwt.auth.converter.principle-attribute = preferred_username
jwt.auth.converter.resource-id = gestor-conocimiento-client-api-rest

logging.level.org.keycloak=DEBUG

